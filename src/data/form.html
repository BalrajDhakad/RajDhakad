<form class="form" id="projectForm" novalidate>
    <div class="field"><span class="field__n">01</span><label class="field__q" for="fName">What should we call you?</label><input id="fName" name="Name" type="text" autocomplete="name" required placeholder="Your name"></div>
    <div class="field"><span class="field__n">02</span><label class="field__q" for="fMail">Drop your email</label><input id="fMail" name="Email" type="email" autocomplete="email" required placeholder="you@brand.com"></div>
    <div class="field"><span class="field__n">03</span><label class="field__q" for="fPhone">Your mobile number</label><div class="phone"><select id="fCode" name="Country code" required aria-label="Country code"><option value="" disabled selected>Code</option></select><input id="fPhone" name="Mobile number" type="tel" inputmode="tel" autocomplete="tel-national" required pattern="[0-9 \(\)\-]{5,15}" title="Your number without the country code, e.g. 98765 43210" placeholder="98765 43210"></div></div>
    <div class="field" role="group" aria-labelledby="q3"><span class="field__n">04</span><span class="field__q" id="q3">What are you?</span><div class="chips"><label class="chip" data-cursor="link"><input type="radio" name="I am a" value="Brand" required><span>Brand</span></label><label class="chip" data-cursor="link"><input type="radio" name="I am a" value="Creator"><span>Creator</span></label><label class="chip" data-cursor="link"><input type="radio" name="I am a" value="Agency"><span>Agency</span></label><label class="chip" data-cursor="link"><input type="radio" name="I am a" value="SaaS / Startup"><span>SaaS / Startup</span></label></div></div>
    <div class="field"><span class="field__n">05</span><label class="field__q" for="fLink">Brand or channel, with a link</label><input id="fLink" name="Brand or channel link" type="text" required placeholder="Name + website or @handle"></div>
    <div class="field"><span class="field__n">06</span><label class="field__q" for="fNiche">What niche are you in?</label><input id="fNiche" name="Niche" type="text" required placeholder="SaaS, fashion, fitness, finance…"></div>
    <div class="field" role="group" aria-labelledby="q6"><span class="field__n">07</span><span class="field__q" id="q6">What are you looking for?</span><div class="chips"><label class="chip" data-cursor="link"><input type="checkbox" name="Looking for" value="SaaS Launch Video"><span>SaaS Launch Video</span></label><label class="chip" data-cursor="link"><input type="checkbox" name="Looking for" value="Brand Film"><span>Brand Film</span></label><label class="chip" data-cursor="link"><input type="checkbox" name="Looking for" value="Motion Identity"><span>Motion Identity</span></label><label class="chip" data-cursor="link"><input type="checkbox" name="Looking for" value="Social Media Motion"><span>Social Media Motion</span></label><label class="chip" data-cursor="link"><input type="checkbox" name="Looking for" value="Not sure yet"><span>Not sure yet</span></label></div></div>
    <div class="field"><span class="field__n">08</span><label class="field__q" for="fAbout">Tell us about the project</label><textarea id="fAbout" name="Project details" required placeholder="What are you making, who is it for, and what should it do?"></textarea></div>
    <div class="field" role="group" aria-labelledby="q8"><span class="field__n">09</span><span class="field__q" id="q8">Budget range</span><div class="chips" id="budgetChips"><label class="chip" data-cursor="link"><input type="radio" name="Budget" value="Under $1,000" required><span>Under $1,000</span></label><label class="chip" data-cursor="link"><input type="radio" name="Budget" value="$1,000 – $2,500"><span>$1,000 – $2,500</span></label><label class="chip" data-cursor="link"><input type="radio" name="Budget" value="$2,500 – $5,000"><span>$2,500 – $5,000</span></label><label class="chip" data-cursor="link"><input type="radio" name="Budget" value="$5,000+"><span>$5,000+</span></label><label class="chip" data-cursor="link"><input type="radio" name="Budget" value="Not sure yet"><span>Not sure yet</span></label></div></div>
    <div class="field" role="group" aria-labelledby="q9"><span class="field__n">10</span><span class="field__q" id="q9">When do you need it?</span><div class="chips"><label class="chip" data-cursor="link"><input type="radio" name="Timeline" value="ASAP" required><span>ASAP</span></label><label class="chip" data-cursor="link"><input type="radio" name="Timeline" value="Within a month"><span>Within a month</span></label><label class="chip" data-cursor="link"><input type="radio" name="Timeline" value="1 – 3 months"><span>1 – 3 months</span></label><label class="chip" data-cursor="link"><input type="radio" name="Timeline" value="Flexible"><span>Flexible</span></label></div></div>
    <div class="field"><span class="field__n">11</span><span class="field__q" id="q10">When would you love to talk?</span><div class="when"><input id="fDate" name="Call date" type="date" required aria-labelledby="q10"><input id="fTime" name="Call time" type="time" required aria-label="Time"></div><p class="tz tz--hours">Working hours: Monday to Friday, 10 AM to 6 PM.</p><p class="tz" id="tz"></p></div>
    <div class="field"><span class="field__n">12</span><label class="field__q" for="fFound">How did you find us?</label><input id="fFound" name="Found us via" type="text" required placeholder="Instagram, a friend, Behance…"></div>
    <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
    <label class="agree"><input type="checkbox" name="Agreed to terms" required><span>I agree to the <a href="#/terms" data-cursor="link">Terms and Conditions</a></span></label>
    <button class="form__go" type="submit" data-cursor="link">Send it <span>→</span></button>
    <p class="form__err" id="fErr" role="alert" hidden></p>
  </form>
